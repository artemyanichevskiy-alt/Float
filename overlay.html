<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForestCraft Overlay</title>
<style>
:root{--ink:#eaf2e6;--dim:#93a690;--moss:#8fd16a;--line:#2f4633;--bg:rgba(10,18,12,.94)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px/1.4 Montserrat,system-ui,'Segoe UI',sans-serif;color:var(--ink);user-select:none}
#card{height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.55)}
#bar{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;height:44px;flex:none;cursor:pointer;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;width:100%;text-align:left}
#bar:hover{background:rgba(143,209,106,.1)}
#bar .dot{width:10px;height:10px;border-radius:3px;background:var(--moss)}
#bar .sp{flex:1}#bar kbd{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.4);font:600 12px inherit;color:var(--moss)}
#menu{display:none;flex:1;min-height:0;flex-direction:column;border-top:1px solid var(--line)}
.open #menu{display:flex}
#body{flex:1;overflow:auto;padding:8px 12px 12px;scrollbar-width:thin}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:700;color:var(--moss);padding:6px 0;list-style:none}summary::-webkit-details-marker{display:none}
summary:before{content:"▸ "}details[open] summary:before{content:"▾ "}
label{display:grid;gap:3px;margin:7px 0;color:var(--dim);font-size:12px}
.val{color:var(--ink);font-weight:600;margin-left:6px}
input[type=range]{width:100%;accent-color:var(--moss)}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.4);padding:2px}
select{background:#13201a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.foot{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;gap:8px;align-items:center;flex:none}
.foot button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style></head>
<body><div id="card">
<button id="bar" type="button" aria-expanded="false"><span class="dot"></span><span>ForestCraft</span><span class="sp"></span><kbd id="key">Alt+X</kbd></button>
<div id="menu"><div id="body"></div>
<div class="foot"><span id="st">Сохраняется само</span><button id="close" type="button">Закрыть</button></div></div>
</div>
<script src="overlay.js"></script>
</body></html>
